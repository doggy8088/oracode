[package]
name = "oracode"
version = "0.1.0"
edition = "2024"
description = "Database-as-code CLI for exporting clean, Git-friendly Oracle DDL."
license = "MIT"
repository = "https://github.com/doggy8088/oracode"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.18"
oracle = "0.6"
regex = "1.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "sync"] }

[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["."]

[workspace.metadata.dist]
cargo-dist-version = "0.30.0"
ci = "github"
installers = ["shell", "powershell", "npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
